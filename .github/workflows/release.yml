name: Build and publish reviewed macOS release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check tag and run regressions
        run: |
          python3 -I -B - <<'PY'
          import os, plistlib, re
          from pathlib import Path
          version = plistlib.loads(Path('src/Info.plist').read_bytes())['CFBundleShortVersionString']
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Unexpected release tag'
          assert tag == 'v' + version, 'Tag must match the app version'
          PY
          python3 -I -B -m unittest discover -s tests -v
      - name: Build and verify the app
        run: bash scripts/build.sh --build-only
      - name: Generate and verify ZIP and DMG
        run: |
          python3 -I -B scripts/publish-release.py \
            --app 'build/Breaking the Pattern.app' --project . \
            --archive-root "$RUNNER_TEMP/btp-archive" --install-dir "$RUNNER_TEMP/btp-install"
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/github-release.py --archive "$RUNNER_TEMP/btp-archive/Breaking the Pattern"
